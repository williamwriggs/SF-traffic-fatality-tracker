[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sf-traffic-fatality-tracker"
version = "0.1.0"
description = "A revision-aware tracker for San Francisco traffic fatalities"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "William W. Riggs" }]
dependencies = [
  "matplotlib>=3.8",
  "pandas>=2.2",
  "plotly>=6.0",
  "pyarrow>=17.0",
  "requests>=2.32",
  "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]
plotly-png = ["kaleido>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
