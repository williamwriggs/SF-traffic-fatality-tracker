name: Refresh DataSF snapshots

on:
  workflow_dispatch:
  schedule:
    - cron: "17 15 * * *"

permissions:
  contents: write

concurrency:
  group: datasf-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Test calculations and reconciliation
        run: python -m pytest -q
      - name: Fetch and compare DataSF
        run: python -m src.refresh
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
      - name: Export browser-ready dashboard data
        run: python scripts/export_web_data.py
      - name: Commit a changed snapshot
        run: |
          if git diff --quiet -- data web/public/data; then
            echo "No DataSF changes"
            exit 0
          fi
          git config user.name "sf-fatality-refresh[bot]"
          git config user.email "sf-fatality-refresh[bot]@users.noreply.github.com"
          git add data web/public/data
          git commit -m "data: refresh DataSF snapshot"
          git push
